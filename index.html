<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Climbing Hold Generator</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#2b303b;--text:#eef1f6;--muted:#9ca5b5;--accent:#69d2ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,sans-serif;overflow:hidden}header{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:#12151b}header h1{margin:0;font-size:17px}header span{color:var(--muted);font-size:12px}main{height:calc(100vh - 58px);display:grid;grid-template-columns:320px 1fr}aside{overflow:auto;padding:16px;border-right:1px solid var(--line);background:var(--panel)}.section{border-bottom:1px solid var(--line);padding-bottom:15px;margin-bottom:15px}.section:last-child{border:0}h2{font-size:12px;text-transform:uppercase;letter-spacing:1px;color:#b8c0cf;margin:0 0 12px}label{display:flex;justify-content:space-between;gap:10px;margin:11px 0 5px;color:#d8dde6}output{color:var(--accent)}input[type=range]{width:100%;accent-color:var(--accent)}select,button{width:100%;border:1px solid var(--line);border-radius:8px;background:#11141a;color:var(--text);padding:9px 10px}button{cursor:pointer;font-weight:600}button:hover{border-color:#4b5567;background:#1b2029}.primary{background:#1b9ac7;border-color:#1b9ac7;color:white}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.check{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin:9px 0}.check input{accent-color:var(--accent)}#viewport{position:relative;min-width:0}canvas{display:block;width:100%;height:100%}.hint{position:absolute;left:14px;bottom:14px;background:#101319d9;border:1px solid var(--line);color:var(--muted);padding:8px 10px;border-radius:7px}.status{margin-top:8px;color:var(--muted);font-size:12px;min-height:17px}.mini{font-size:11px;color:var(--muted);margin-top:5px}@media(max-width:800px){body{overflow:auto}main{height:auto;grid-template-columns:1fr}aside{order:2;border-right:0;border-top:1px solid var(--line)}#viewport{height:60vh;min-height:420px}}
</style></head><body>
<header><h1>Climbing Hold Generator</h1><span>Parametric 3D prototype · runs entirely in your browser</span></header>
<main><aside>
<div class="section"><h2>Hold</h2><select id="type"><option value="jug">Jug</option><option value="crimp">Crimp</option><option value="sloper">Sloper</option><option value="pinch">Pinch</option><option value="pocket">Pocket</option><option value="volume">Volume</option></select>
<label>Width <output id="widthOut"></output></label><input id="width" type="range" min="40" max="180" value="100"><label>Height <output id="heightOut"></output></label><input id="height" type="range" min="20" max="110" value="55"><label>Depth <output id="depthOut"></output></label><input id="depth" type="range" min="15" max="90" value="42"><label>Edge / lip <output id="edgeOut"></output></label><input id="edge" type="range" min="0" max="35" value="12"><label>Undercut <output id="underOut"></output></label><input id="undercut" type="range" min="-20" max="30" value="5"><label>Roundness <output id="roundOut"></output></label><input id="roundness" type="range" min="0" max="100" value="55"></div>
<div class="section"><h2>Features</h2><label>Pocket size <output id="pocketOut"></output></label><input id="pocket" type="range" min="0" max="55" value="0"><label>Texture <output id="textureOut"></output></label><input id="texture" type="range" min="0" max="100" value="22"><label class="check"><input id="screwHole" type="checkbox" checked>Add screw hole</label><label class="check"><input id="boltHole" type="checkbox">Add bolt hole</label><label class="check"><input id="symmetry" type="checkbox" checked>Symmetric</label></div>
<div class="section"><h2>Orientation</h2><label>Rotation <output id="rotOut"></output></label><input id="rotation" type="range" min="-180" max="180" value="0"><label>Tilt <output id="tiltOut"></output></label><input id="tilt" type="range" min="-45" max="45" value="0"></div>
<div class="section"><div class="row"><button class="primary" id="random">Randomize</button><button id="reset">Reset</button></div><div style="height:8px"></div><button id="download">Export STL</button><div class="status" id="status"></div><div class="mini">STL is generated locally. Inspect geometry before manufacturing.</div></div>
</aside><section id="viewport"><div class="hint">Drag to rotate · wheel to zoom · right-drag to pan</div></section></main>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{STLExporter}from'three/addons/exporters/STLExporter.js';
const $=id=>document.getElementById(id),fields=['width','height','depth','edge','undercut','roundness','pocket','texture','rotation','tilt'];const p=id=>+$(id).value;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x0f1115);const camera=new THREE.PerspectiveCamera(42,1,1,3000);camera.position.set(150,115,190);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputColorSpace=THREE.SRGBColorSpace;$('viewport').appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,20,0);scene.add(new THREE.HemisphereLight(0xdbeeff,0x24272d,2.4));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(160,220,200);scene.add(key);const fill=new THREE.DirectionalLight(0x8fc7ff,1.4);fill.position.set(-180,80,-120);scene.add(fill);const grid=new THREE.GridHelper(500,20,0x303640,0x20242b);grid.rotation.x=Math.PI/2;grid.position.z=-38;scene.add(grid);let hold=null;
function params(){return{type:$('type').value,width:p('width'),height:p('height'),depth:p('depth'),edge:p('edge'),undercut:p('undercut'),roundness:p('roundness'),pocket:p('pocket'),texture:p('texture'),rotation:p('rotation'),tilt:p('tilt'),screwHole:$('screwHole').checked,boltHole:$('boltHole').checked,symmetry:$('symmetry').checked}}
function labels(){fields.forEach(id=>$(id+'Out').textContent=$(id).value+(id==='rotation'||id==='tilt'?'°':' mm'))}fields.forEach(id=>$(id).addEventListener('input',()=>{labels();build()}));['type','screwHole','boltHole','symmetry'].forEach(id=>$(id).addEventListener('change',build));
function geom(t){const W=t.width,H=t.height,D=t.depth,nx=72,ny=38,v=[],ix=[];function fy(x,z){const xn=x/(W/2),zn=z/H,a=Math.max(0,1-xn*xn),rr=t.roundness/100;let y=D*(.28+.58*Math.pow(a,.35+rr*.55));y*=1-.2*Math.max(0,Math.min(1,zn*2));if(t.type==='sloper')y+=D*.18*(1-zn);if(t.type==='jug')y+=D*.08*Math.sin(Math.PI*zn);if(t.type==='crimp')y-=D*.16*Math.max(0,zn-.55);if(t.type==='pinch')y*=.82+.18*(1-Math.abs(xn));if(t.type==='volume')y=D*.28+D*.12*Math.pow(a,.5);y+=(t.edge/35)*D*.1*Math.exp(-Math.pow((zn-.62)/.18,2));y+=(t.undercut/30)*D*.07*(1-zn);const n=Math.sin((x+W)*12.9898+(z+H)*78.233)*43758.5453;return y+(n-Math.floor(n)-.5)*(t.texture/100)*1.6}for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){const x=-W/2+i/nx*W,z=j/ny*H;v.push(x,fy(x,z),z)}const row=nx+1;for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=j*row+i,b=a+1,c=a+row,d=c+1;ix.push(a,c,b,b,c,d)}const bs=v.length/3;for(let j=0;j<=ny;j++)for(let i=0;i<=nx;i++){const x=-W/2+i/nx*W,z=j/ny*H;v.push(x,-D*.12,z)}for(let j=0;j<ny;j++)for(let i=0;i<nx;i++){const a=bs+j*row+i,b=a+1,c=a+row,d=c+1;ix.push(a,b,c,b,d,c)}function q(a,b,c,d){ix.push(a,b,c,a,c,d)}for(let i=0;i<nx;i++){q(i,bs+i,bs+i+1,i+1);q(ny*row+i+1,bs+ny*row+i+1,bs+ny*row+i,ny*row+i)}for(let j=0;j<ny;j++){q((j+1)*row,bs+(j+1)*row,bs+j*row,j*row);q(j*row+nx,bs+j*row+nx,bs+(j+1)*row+nx,(j+1)*row+nx)}const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));g.setIndex(ix);g.computeVertexNormals();return g}
function hole(x,z,r,d){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d,32),new THREE.MeshStandardMaterial({color:0x090b0f,roughness:1}));m.rotation.x=Math.PI/2;m.position.set(x,d/2-2,z);hold.add(m);const t=new THREE.Mesh(new THREE.TorusGeometry(r,1.3,8,32),new THREE.MeshStandardMaterial({color:0x252a32,roughness:.9}));t.rotation.x=Math.PI/2;t.position.set(x,2,z);hold.add(t)}
function build(){const t=params();if(hold)scene.remove(hold);hold=new THREE.Group();hold.add(new THREE.Mesh(geom(t),new THREE.MeshStandardMaterial({color:0xe76f51,roughness:.82})));if(t.screwHole)hole(0,t.height*.35,4.5,t.depth*.5);if(t.boltHole)hole(0,t.height*.52,7,t.depth*.5);if(t.pocket>0){const m=new THREE.Mesh(new THREE.SphereGeometry(Math.max(4,t.pocket/2),28,18),new THREE.MeshStandardMaterial({color:0x090b0f,roughness:1}));m.scale.set(1.7,1,.75);m.position.set(0,t.depth*.52,t.height*.62);hold.add(m)}hold.rotation.y=THREE.MathUtils.degToRad(t.tilt);hold.rotation.z=THREE.MathUtils.degToRad(t.rotation);scene.add(hold);$('status').textContent=`Generated ${t.type} · ${Math.round(t.width)} × ${Math.round(t.height)} × ${Math.round(t.depth)} mm`}
function resize(){const r=$('viewport').getBoundingClientRect();camera.aspect=r.width/r.height;camera.updateProjectionMatrix();renderer.setSize(r.width,r.height,false)}window.addEventListener('resize',resize);resize();$('reset').onclick=()=>{const d={type:'jug',width:100,height:55,depth:42,edge:12,undercut:5,roundness:55,pocket:0,texture:22,rotation:0,tilt:0};$('type').value=d.type;fields.forEach(id=>$(id).value=d[id]);$('screwHole').checked=true;$('boltHole').checked=false;$('symmetry').checked=true;labels();build()};$('random').onclick=()=>{const ts=['jug','crimp','sloper','pinch','pocket','volume'];$('type').value=ts[Math.floor(Math.random()*ts.length)];$('width').value=Math.round(55+Math.random()*100);$('height').value=Math.round(28+Math.random()*60);$('depth').value=Math.round(20+Math.random()*55);$('edge').value=Math.round(Math.random()*30);$('undercut').value=Math.round(-12+Math.random()*35);$('roundness').value=Math.round(15+Math.random()*80);$('pocket').value=Math.round(Math.random()*40);$('texture').value=Math.round(5+Math.random()*60);$('rotation').value=Math.round(-30+Math.random()*60);$('tilt').value=Math.round(-15+Math.random()*30);labels();build()};$('download').onclick=()=>{const stl=new STLExporter().parse(hold,{binary:true}),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([stl],{type:'model/stl'}));a.download=`climbing-hold-${$('type').value}.stl`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('status').textContent='STL exported.'};labels();build();(function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)})();
</script></body></html>
